[tools]
aws-cli = "latest"
azure-cli = "latest"
gcloud = "latest"
go = "latest"
node = "latest"
# claude は宣言しない: native install（`claude install` → ~/.local/bin/claude）で自己更新させる。npm: で入れると自己更新と衝突する
# codex は self-updater が壊れる（pnpm 誤判定）ので `codex update` ではなく `mise up npm:@openai/codex`（.zshrc で振り替え済み）
"npm:@openai/codex" = "latest"
"npm:@googleworkspace/cli" = "latest"
"npm:claude-code-monitor" = "latest"
"npm:gitnexus" = "latest"
"npm:portless" = "latest"
"npm:pyright" = "latest"
pnpm = "latest"
python = "latest"
terraform = "latest"
uv = "latest"

[settings]
idiomatic_version_file_enable_tools = ["python"]
